# RAK13300 (Semtech SX1262) LoRa module in Slot 2 of the RAK6421 base board.
# Source: meshtastic/firmware bin/config.d/lora-RAK6421-13300-slot2.yaml
# BCM GPIO: IRQ=18, Reset=24, Busy=19, Enable=26+23. SPI via spidev0.1 (CE1).
Meta:
  name: RAK6421 + RAK13300 Slot 2
  support: official
  compatible:
    - raspberry-pi

Lora:
  Module: sx1262
  IRQ: 18      # IO6
  Reset: 24    # IO4
  Busy: 19     # IO5
  Enable_Pins:
    - 26
    - 23
  DIO3_TCXO_VOLTAGE: true
  DIO2_AS_RF_SWITCH: true
  spidev: spidev0.1
  # CS: 7
