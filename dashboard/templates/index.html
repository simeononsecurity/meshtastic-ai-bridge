<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meshtastic Mesh Assistant</title>
  <style>
    :root{--bg:#0b1020;--panel:#121a2d;--panel2:#17223a;--line:#263451;--text:#edf3ff;--muted:#8fa1c0;--blue:#5aa7ff;--green:#4cdb9b;--red:#ff7185;--yellow:#ffd166}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#172c50 0,#0b1020 42%);color:var(--text);font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    header{padding:24px clamp(18px,4vw,52px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:12px;margin-right:auto}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:var(--muted);font-size:12px}.pill.ok{color:var(--green);border-color:#267b5d}.pill.bad{color:var(--red);border-color:#80384a}
    main{max-width:1400px;margin:auto;padding:24px clamp(18px,4vw,52px);display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.card{background:rgba(18,26,45,.92);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 12px 35px #0002;min-width:0}.wide{grid-column:span 8}.side{grid-column:span 4}.full{grid-column:1/-1}@media(max-width:950px){.wide,.side{grid-column:1/-1}}
    h2{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--panel2);border-radius:11px;padding:12px}.stat b{display:block;font-size:20px;margin-top:5px}.stat span,.hint{color:var(--muted);font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:11px 0;gap:10px}.row:last-child{border:0}.state{color:var(--green)}.state.bad{color:var(--red)}button,input,select{font:inherit;border-radius:9px;border:1px solid var(--line);padding:9px 11px;background:#0b1222;color:var(--text)}button{cursor:pointer}button:hover{border-color:var(--blue);background:#162541}button.primary{background:var(--blue);border-color:var(--blue);color:#07111f;font-weight:700}button.danger{color:var(--yellow)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}input{min-width:210px;flex:1}pre{margin:0;background:#080d18;border:1px solid var(--line);border-radius:11px;padding:13px;max-height:360px;overflow:auto;white-space:pre-wrap;color:#cbd9f4;font-size:12px}.feed{max-height:430px;overflow:auto}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.meta{color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:8px}.question{margin:8px 0;color:#dbe7ff}.answer{background:#17243d;border-radius:9px;padding:10px;color:#c8dcff;line-height:1.45}.notice{padding:10px;border-radius:9px;background:#14243b;color:#b9cff3;font-size:12px;margin-top:10px}.empty{color:var(--muted);padding:16px 0}
  </style>
</head>
<body>
<header><h1>Meshtastic Mesh Assistant</h1><span class="sub">Meshtastic AI bridge control center</span><span id="mesh" class="pill">mesh checking…</span><span id="model" class="pill">model…</span><button id="refresh" class="primary">Refresh</button></header>
<main>
  <section class="card wide"><h2>Overview</h2><div class="stats"><div class="stat"><span>Mesh node</span><b id="node">—</b></div><div class="stat"><span>Queue depth</span><b id="queue">—</b></div><div class="stat"><span>Bot prefix</span><b id="prefix">—</b></div></div><div class="notice" id="notice">The dashboard uses the bridge-owned connection queue; it will not open a competing TCP session.</div></section>
  <section class="card side"><h2>Services</h2><div id="services"></div></section>
  <section class="card side"><h2>Model</h2><div class="toolbar"><select id="model-select"></select><button id="switch" class="primary">Use</button></div><div class="toolbar"><input id="pull-name" placeholder="Ollama model tag"><button id="pull">Pull</button></div><div class="hint" id="model-note"></div></section>
  <section class="card wide"><h2>Mesh data</h2><div class="toolbar"><button data-cmd="info">Connection</button><button data-cmd="nodes">Nodes</button><button data-cmd="channels">Channels</button></div><pre id="mesh-out">Select a view.</pre></section>
  <section class="card full"><h2>Bot activity</h2><div class="toolbar"><button id="reload-feed" class="primary">Refresh activity</button><label class="hint"><input type="checkbox" id="auto" checked> auto-refresh</label></div><div id="feed" class="feed"></div></section>
</main>
<script>
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt){const r=await fetch(url,opt);const x=await r.json();if(!r.ok)throw Error(x.error||x.text||r.status);return x}
function time(ts){return new Date(ts*1000).toLocaleString()}
async function status(){try{const s=await api('/api/status');$('mesh').textContent=s.mesh_reachable?'mesh connected':'mesh offline';$('mesh').className='pill '+(s.mesh_reachable?'ok':'bad');$('model').textContent='model '+s.model;$('node').textContent=s.mesh?.my_id||'—';$('queue').textContent=s.mesh?.queue_depth??'—';$('prefix').textContent=s.bot_prefix||'—';$('services').innerHTML=s.services.map(x=>`<div class="row"><span>${esc(x.name)}</span><span class="state ${x.state==='active'?'':'bad'}">${esc(x.state)}</span><span><button data-service="${esc(x.name)}" data-action="restart">restart</button></span></div>`).join('')}catch(e){$('notice').textContent='Status error: '+e.message}}
async function models(){try{const m=await api('/api/models');$('model-select').innerHTML=m.models.map(x=>`<option ${x===m.active?'selected':''}>${esc(x)}</option>`).join('');$('model-note').textContent='Active: '+m.active}catch(e){$('model-note').textContent=e.message}}
async function feed(){try{const a=await api('/api/responses?limit=100');$('feed').innerHTML=a.length?a.slice().reverse().map(x=>`<div class="item"><div class="meta"><span>${time(x.ts)}</span><span>${esc(x.from)} · ${esc(x.model)}</span></div><div class="question"><b>Q:</b> ${esc(x.prompt)}</div><div class="answer">${esc(x.reply)}</div></div>`).join(''):'<div class="empty">No bot activity yet.</div>'}catch(e){$('feed').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function mesh(cmd){$('mesh-out').textContent='Loading…';try{const x=await api('/api/mesh?cmd='+cmd);$('mesh-out').textContent=x.text||JSON.stringify(x.data,null,2)}catch(e){$('mesh-out').textContent=e.message}}
document.addEventListener('click',async e=>{const t=e.target;if(t.dataset.cmd)mesh(t.dataset.cmd);if(t.dataset.service){await api('/api/service/'+t.dataset.service+'/'+t.dataset.action,{method:'POST'});status()}});
$('refresh').onclick=()=>{status();models();feed()};$('reload-feed').onclick=feed;$('switch').onclick=async()=>{await api('/api/model',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:$('model-select').value})});models();status()};$('pull').onclick=async()=>{const model=$('pull-name').value.trim();if(model){await api('/api/model/pull',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model})});$('model-note').textContent='Pull started: '+model}};status();models();feed();setInterval(status,15000);setInterval(()=>{if($('auto').checked)feed()},7000);
</script>
</body></html>
