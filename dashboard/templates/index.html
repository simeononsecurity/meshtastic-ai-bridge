<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meshtastic AI Bridge</title>
  <style>
    :root { --bg:#0f1115; --panel:#1a1d26; --line:#2c3140; --fg:#e6e9f0; --muted:#8b93a7; --accent:#4ea1ff; --ok:#35c07a; --bad:#e05656; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
    header h1 { font-size:18px; margin:0; }
    .badge { padding:4px 10px; border-radius:999px; font-size:12px; background:var(--panel); border:1px solid var(--line); }
    .badge.ok { color:var(--ok); border-color:var(--ok); }
    .badge.bad { color:var(--bad); border-color:var(--bad); }
    main { padding:20px 24px; display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:1100px; margin:0 auto; }
    @media (max-width: 820px) { main { grid-template-columns:1fr; } }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; }
    .card h2 { font-size:14px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
    .row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); gap:8px; flex-wrap:wrap; }
    .row:last-child { border-bottom:none; }
    button { background:var(--line); color:var(--fg); border:none; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
    button:hover { background:#3a4152; }
    button.primary { background:var(--accent); color:#fff; }
    button.danger:hover { background:var(--bad); }
    button:disabled { opacity:.5; cursor:default; }
    input, select { background:#0a0c10; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font-size:13px; }
    pre { background:#0a0c10; border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; font-size:12px; max-height:420px; white-space:pre-wrap; }
    .logitem { border-bottom:1px solid var(--line); padding:10px 0; }
    .logitem:last-child { border-bottom:none; }
    .meta { color:var(--muted); font-size:12px; margin-bottom:4px; display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
    .q { font-size:13px; margin:0 0 6px; }
    .a { font-size:13px; color:#c9d6ff; background:#141824; border-radius:6px; padding:8px; }
    .muted { color:var(--muted); font-size:12px; }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  </style>
</head>
<body>
  <header>
    <h1>Meshtastic AI Bridge</h1>
    <span id="mesh" class="badge">mesh: ?</span>
    <span id="model" class="badge">model: ?</span>
    <button id="refresh" class="primary">Refresh</button>
  </header>
  <main>
    <section class="card">
      <h2>Services</h2>
      <div id="services"></div>
    </section>
    <section class="card">
      <h2>Model</h2>
      <div class="toolbar">
        <select id="model-select"></select>
        <button id="btn-switch" class="primary">Switch</button>
      </div>
      <div class="toolbar">
        <input id="model-input" placeholder="ollama tag, e.g. llama3.2:1b">
        <button id="btn-pull">Pull</button>
      </div>
      <div class="muted" id="model-note"></div>
    </section>
    <section class="card">
      <h2>Mesh &amp; Channels</h2>
      <div class="toolbar">
        <button data-cmd="info">Info</button>
        <button data-cmd="nodes">Nodes</button>
        <button data-cmd="channels">Channels</button>
        <button data-cmd="position">Position</button>
        <button id="btn-apply" class="danger">Apply .env Config</button>
      </div>
      <pre id="mesh-out">Click a button to query the node.</pre>
    </section>
    <section class="card">
      <h2>Bot Responses</h2>
      <div class="toolbar">
        <button id="btn-resp">Refresh Responses</button>
        <label class="muted"><input type="checkbox" id="auto" checked> auto-refresh</label>
      </div>
      <div id="responses"><div class="muted">No responses yet.</div></div>
    </section>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    async function json(path, opts) { const r = await fetch(path, opts); return r.json(); }
    function fmt(ts) { return ts ? new Date(ts * 1000).toLocaleString() : ''; }
    function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    async function refreshStatus() {
      try {
        const s = await json('/api/status');
        document.getElementById('mesh').textContent = 'mesh: ' + (s.mesh_reachable ? 'up' : 'down');
        document.getElementById('mesh').className = 'badge ' + (s.mesh_reachable ? 'ok' : 'bad');
        document.getElementById('model').textContent = 'model: ' + s.model;
        const box = document.getElementById('services');
        box.innerHTML = '';
        for (const svc of s.services) {
          const div = document.createElement('div');
          div.className = 'row';
          div.innerHTML = '<strong>' + svc.name + '</strong>' +
            '<span>' + (svc.state === 'active' ? 'active' : svc.state) + '</span>' +
            '<span style="display:flex;gap:6px">' +
            '<button data-svc="' + svc.name + '" data-act="start">start</button>' +
            '<button data-svc="' + svc.name + '" data-act="stop">stop</button>' +
            '<button data-svc="' + svc.name + '" data-act="restart">restart</button></span>';
          box.appendChild(div);
        }
      } catch (e) { console.error(e); }
    }
    async function refreshModels() {
      const m = await json('/api/models');
      const sel = document.getElementById('model-select');
      sel.innerHTML = '';
      for (const name of m.models) {
        const o = document.createElement('option');
        o.value = name; o.textContent = name;
        if (name === m.active) o.selected = true;
        sel.appendChild(o);
      }
      document.getElementById('model-note').textContent = 'active: ' + m.active;
    }
    async function refreshResponses() {
      const list = await json('/api/responses?limit=100');
      const box = document.getElementById('responses');
      if (!list.length) { box.innerHTML = '<div class="muted">No responses yet.</div>'; return; }
      box.innerHTML = '';
      for (const item of list) {
        const d = document.createElement('div');
        d.className = 'logitem';
        d.innerHTML = '<div class="meta"><span>' + fmt(item.ts) + '</span><span>' + (item.from || '') + '</span><span>' + (item.model || '') + '</span></div>' +
          '<p class="q"><strong>Q:</strong> ' + esc(item.prompt || '') + '</p>' +
          '<div class="a">' + esc(item.reply || '') + '</div>';
        box.prepend(d);
      }
    }
    async function loadMesh(cmd) {
      document.getElementById('mesh-out').textContent = 'Loading...';
      const r = await json('/api/mesh?cmd=' + cmd);
      document.getElementById('mesh-out').textContent = r.text || '(no output)';
    }
    document.addEventListener('click', async (e) => {
      const t = e.target;
      if (t.dataset.svc) { await json('/api/service/' + t.dataset.svc + '/' + t.dataset.act, {method:'POST'}); refreshStatus(); }
      if (t.dataset.cmd) loadMesh(t.dataset.cmd);
    });
    document.getElementById('btn-switch').onclick = async () => {
      const model = document.getElementById('model-select').value;
      if (!model) return;
      await json('/api/model', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({model})});
      refreshModels(); refreshStatus();
    };
    document.getElementById('btn-pull').onclick = async () => {
      const model = document.getElementById('model-input').value.trim();
      if (!model) return;
      await json('/api/model/pull', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({model})});
      document.getElementById('model-note').textContent = 'pulling ' + model + '...';
    };
    document.getElementById('btn-resp').onclick = refreshResponses;
    document.getElementById('refresh').onclick = () => { refreshStatus(); refreshModels(); };
    document.getElementById('btn-apply').onclick = async () => {
      document.getElementById('mesh-out').textContent = 'Applying...';
      const r = await json('/api/apply', {method:'POST'});
      document.getElementById('mesh-out').textContent = r.text || '(done)';
      refreshStatus();
    };
    refreshStatus(); refreshModels(); refreshResponses();
    setInterval(refreshStatus, 15000);
    setInterval(() => { if (document.getElementById('auto').checked) refreshResponses(); }, 5000);
  </script>
</body>
</html>
