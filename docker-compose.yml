name: meshtastic-ai-support

services:
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama", "all"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    profiles: ["kiwix", "all"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - "${KIWIX_DATA_DIR:-./zim}:/data:ro"
    command: ["sh", "-c", "exec kiwix-serve --address 0.0.0.0 --port 8766 --nosearchbar /data/*.zim"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8766/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_models: